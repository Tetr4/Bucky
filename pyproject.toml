[project]
name = "Bucky"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "langchain>=0.3.12",
    "langchain-ollama>=0.2.1",
    "langchain-community>=0.3.12",
    "langgraph>=0.2.59",
    "pytz>=2024.2",
    "sounddevice>=0.5.1",
    "requests>=2.32.3",
    "SpeechRecognition==3.12.0",
    "openai-whisper>=20240930",
    "pyaudio>=0.2.14",
    "httpx>=0.27.2",
    "opencv-python>=4.11.0.86",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "coqui-tts>=0.26.0",
    "mediapipe==0.10.21",
    "deepfilternet>=0.5.6",
    "noisereduce>=3.0.3",
    "transformers<4.50.0",
    "demoji>=2.0.0",
    "aec-audio-processing>=1.0.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
